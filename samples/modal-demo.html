<!-- title: Confirm delete modal -->
<!-- as: modal -->
<h2 style="margin: 0 0 12px;">Delete this file?</h2>
<p style="margin: 0 0 16px; color: var(--text-muted);">
  <strong>untitled.md</strong> will be moved to system trash.
  Type the file name to confirm.
</p>

<input type="text" spellcheck="false" placeholder="untitled.md" style="width: 100%; margin-bottom: 16px;">

<div style="display: flex; gap: 8px; justify-content: flex-end;">
  <button>Cancel</button>
  <button class="mod-cta mod-warning">Delete</button>
</div>
