<!-- title: Chart.js example -->
<!-- viewport: desktop -->
<div style="max-width: 720px; margin: 32px auto; padding: 24px;">
  <h2>Simple chart (JSON-only path)</h2>
  <p>Use <code>data-chart-config</code> with a JSON Chart.js config when your chart doesn't need function callbacks.</p>

  <div style="height: 280px; margin-top: 16px; position: relative;">
    <canvas data-chart-config='{
      "type": "bar",
      "data": {
        "labels": ["Mon", "Tue", "Wed", "Thu", "Fri"],
        "datasets": [{
          "label": "Sales",
          "data": [12, 19, 7, 15, 22],
          "backgroundColor": "#5DCAA5"
        }]
      },
      "options": {
        "responsive": true,
        "maintainAspectRatio": false,
        "plugins": { "legend": { "display": true } },
        "scales": {
          "y": { "beginAtZero": true }
        }
      }
    }'></canvas>
  </div>

  <h2 style="margin-top: 32px;">Advanced chart (inline script path)</h2>
  <p>When you need tick callbacks, color functions, or datalabels formatters, write an inline <code>&lt;script&gt;</code>:</p>

  <div style="height: 280px; margin-top: 16px; position: relative;">
    <canvas id="custom-chart"></canvas>
  </div>
  <script>
    (function () {
      if (typeof Chart === 'undefined') return;
      var c = document.getElementById('custom-chart');
      if (!c) return;
      new Chart(c, {
        type: 'line',
        data: {
          labels: ['Q1', 'Q2', 'Q3', 'Q4'],
          datasets: [{
            label: 'Revenue (k)',
            data: [4200, 5100, 4800, 6300],
            borderColor: '#378ADD',
            pointBackgroundColor: '#378ADD',
            tension: 0.3,
            fill: false,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              ticks: { callback: function (v) { return '$' + (v / 1000).toFixed(1) + 'k'; } },
            },
          },
        },
      });
    })();
  </script>
</div>
