<!-- title: Obsidian settings tab -->
<!-- as: settings -->
<div class="setting-item setting-item-heading">
  <div class="setting-item-info">
    <div class="setting-item-name">Example plugin</div>
    <div class="setting-item-description">Mock of a typical Obsidian plugin settings tab.</div>
  </div>
</div>

<div class="setting-item">
  <div class="setting-item-info">
    <div class="setting-item-name">Enable feature</div>
    <div class="setting-item-description">Toggle a boolean setting.</div>
  </div>
  <div class="setting-item-control">
    <div class="checkbox-container is-enabled">
      <input type="checkbox" tabindex="0" checked>
    </div>
  </div>
</div>

<div class="setting-item">
  <div class="setting-item-info">
    <div class="setting-item-name">Display mode</div>
    <div class="setting-item-description">Choose how the panel renders.</div>
  </div>
  <div class="setting-item-control">
    <select class="dropdown">
      <option>Compact</option>
      <option selected>Comfortable</option>
      <option>Spacious</option>
    </select>
  </div>
</div>

<div class="setting-item">
  <div class="setting-item-info">
    <div class="setting-item-name">Folder name</div>
    <div class="setting-item-description">Where mocked data is saved.</div>
  </div>
  <div class="setting-item-control">
    <input type="text" spellcheck="false" placeholder="Mockup" value="Mockup">
  </div>
</div>

<div class="setting-item">
  <div class="setting-item-info">
    <div class="setting-item-name">Reset data</div>
    <div class="setting-item-description">Destructive action example.</div>
  </div>
  <div class="setting-item-control">
    <button>Reset</button>
    <button class="mod-cta">Save changes</button>
  </div>
</div>
