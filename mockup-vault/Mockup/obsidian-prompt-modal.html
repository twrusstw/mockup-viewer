<!-- title: Prompt modal -->
<!-- as: modal -->
<h2 style="margin: 0 0 12px;">Delete wallet?</h2>
<p style="margin: 0 0 16px; color: var(--text-muted);">
  This will permanently remove all transactions in <strong>Cash</strong>.
  Type the wallet name to confirm.
</p>

<input type="text" spellcheck="false" placeholder="Cash" style="width: 100%; margin-bottom: 16px;">

<div style="display: flex; gap: 8px; justify-content: flex-end;">
  <button>Cancel</button>
  <button class="mod-cta mod-warning">Delete</button>
</div>
